<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
    <defs>
        <!-- Linear Gradient for Neon Borders -->
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="100%" stop-color="#4facfe" />
        </linearGradient>
        
        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&amp;display=swap');
            .text-s {
                font-family: 'JetBrains Mono', monospace;
                font-weight: 800;
                font-size: 16.5px;
                fill: url(#grad);
            }
        </style>
    </defs>
    
    <!-- Code Brackets < and /> -->
    <g fill="none" stroke="url(#grad)" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round">
        <!-- Left Bracket < -->
        <path d="M 7,9 L 2,16 L 7,23" />
        
        <!-- Slash / -->
        <path d="M 20.5,23 L 22.5,9" />
        
        <!-- Right Bracket > -->
        <path d="M 26.0,9 L 30.5,16 L 26.0,23" />
    </g>

    <!-- Center letter S using the imported JetBrains Mono font -->
    <text x="14.5" y="21.5" class="text-s" text-anchor="middle">S</text>
</svg>
