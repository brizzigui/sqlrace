{% extends 'base.html' %}

{% block title %}Login - SQL Race{% endblock %}

{% block content %}
<div class="auth-wrapper fade-in">
    <div class="auth-card">
        <div class="auth-card-glow"></div>
        <div class="auth-header">
            <h2>{{ _('auth_welcome') }}</h2>
            <p>{{ _('auth_welcome_sub') }}</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">{{ _('auth_team_name') }}</label>
                <input type="text" id="username" name="username" placeholder="{{ _('auth_team_name') }}" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">{{ _('auth_password') }}</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary auth-submit-btn">{{ _('auth_enter_arena') }}</button>
        </form>
        <div class="auth-footer">
            <p>{{ _('auth_need_register') }} <a href="{{ url_for('auth.register') }}">{{ _('auth_create_team') }}</a></p>
        </div>
    </div>
</div>
{% endblock %}
