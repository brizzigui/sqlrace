{% extends 'base.html' %}

{% block title %}Login - SQL Race{% endblock %}

{% block content %}
<div class="auth-wrapper fade-in">
    <div class="auth-card">
        <div class="auth-card-glow"></div>
        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Log in with your team account to start the race</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Team Name</label>
                <input type="text" id="username" name="username" placeholder="Enter your team name" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary auth-submit-btn">Enter Arena</button>
        </form>
        <div class="auth-footer">
            <p>Need to register? <a href="{{ url_for('auth.register') }}">Create a Team Account</a></p>
        </div>
    </div>
</div>
{% endblock %}
