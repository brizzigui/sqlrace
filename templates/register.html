{% extends 'base.html' %}

{% block title %}Register Team - SQL Race{% endblock %}

{% block content %}
<div class="auth-wrapper fade-in">
    <div class="auth-card">
        <div class="auth-card-glow"></div>
        <div class="auth-header">
            <h2>Join the Race</h2>
            <p>Register your team to participate in SQL challenges</p>
        </div>
        <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Team Name</label>
                <input type="text" id="username" name="username" placeholder="Pick a unique name" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary auth-submit-btn">Register Team</button>
        </form>
        <div class="auth-footer">
            <p>Already have a team? <a href="{{ url_for('auth.login') }}">Log in here</a></p>
        </div>
    </div>
</div>
{% endblock %}
