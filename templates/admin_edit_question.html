{% extends 'base.html' %}

{% block title %}{{ _('admin_edit_question') }} - SQL Race{% endblock %}

{% block content %}
<div class="admin-container fade-in" style="max-width: 800px; margin: 0 auto;">
    <div class="dashboard-header" style="margin-bottom: 24px;">
        <a href="{{ url_for('admin.admin_dashboard') }}" class="back-link" style="color: var(--primary-color); text-decoration: none; display: inline-block; margin-bottom: 12px;">&larr; {{ _('leaderboard_back') }}</a>
        <h1>{{ _('admin_edit_question') }}</h1>
        <p>Editing Question #{{ question.id }}</p>
    </div>

    <div class="admin-card">
        <form action="{{ url_for('admin.edit_question', question_id=question.id) }}" method="POST" class="admin-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="visibility">{{ _('admin_visibility') }}</label>
                    <select id="visibility" name="visibility" required>
                        <option value="public" {% if question.visibility == 'public' %}selected{% endif %}>{{ _('admin_public') }}</option>
                        <option value="restricted" {% if question.visibility == 'restricted' %}selected{% endif %}>{{ _('admin_restricted') }}</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="difficulty">{{ _('admin_difficulty') }}</label>
                    <select id="difficulty" name="difficulty" required>
                        <option value="1" {% if question.difficulty == 1 %}selected{% endif %}>★ (1/5)</option>
                        <option value="2" {% if question.difficulty == 2 %}selected{% endif %}>★★ (2/5)</option>
                        <option value="3" {% if question.difficulty == 3 %}selected{% endif %}>★★★ (3/5)</option>
                        <option value="4" {% if question.difficulty == 4 %}selected{% endif %}>★★★★ (4/5)</option>
                        <option value="5" {% if question.difficulty == 5 %}selected{% endif %}>★★★★★ (5/5)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="q_title">{{ _('admin_question_title') }}</label>
                <input type="text" id="q_title" name="title" value="{{ question.title }}" placeholder="e.g., Finding Top Spenders" required>
            </div>
            <div class="form-group">
                <label for="q_description">{{ _('admin_statement') }}</label>
                <textarea id="q_description" name="description" rows="5" placeholder="Describe the task and the schema structure..." required>{{ question.description }}</textarea>
            </div>
            
            <!-- Inline Image Uploader Helper -->
            <div style="background: rgba(255,255,255,0.02); border: 1px dashed var(--border-color); padding: 12px; border-radius: 6px; margin-bottom: 16px;">
                <label style="font-size: 0.85rem; color: var(--text-muted); display: block; margin-bottom: 6px;">{{ _('admin_upload_image') }}</label>
                <div class="uploader-flex-row" style="display: flex; gap: 8px; align-items: center;">
                    <input type="file" id="image-upload-input" accept="image/*" style="flex: 1; border: 1px solid var(--border-color); padding: 4px; border-radius: 4px; background: var(--bg-surface); color: var(--text-secondary); font-size: 0.8rem;">
                    <button type="button" class="btn btn-primary" onclick="handleImageUpload()" style="padding: 6px 12px; font-size: 0.85rem;">{{ _('admin_upload_btn') }}</button>
                </div>
                <div id="image-upload-result" style="margin-top: 8px; display: none;">
                    <label style="font-size: 0.75rem; color: var(--text-muted);">{{ _('admin_copy_tag') }}:</label>
                    <div class="uploader-flex-row" style="display: flex; gap: 8px; margin-top: 4px;">
                        <input type="text" id="image-tag-output" readonly style="flex: 1; padding: 6px; border: 1px solid var(--border-color); border-radius: 4px; background: var(--bg-main); color: var(--primary-color); font-family: var(--font-mono); font-size: 0.8rem;">
                        <button type="button" class="btn btn-outline" onclick="copyImageTag()" style="padding: 4px 10px; font-size: 0.8rem;">Copy</button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="init_sql">{{ _('admin_init_sql') }}</label>
                <textarea id="init_sql" name="init_sql" rows="6" class="code-textarea" placeholder="CREATE TABLE employees (id INT, salary INT);..." required>{{ question.init_sql }}</textarea>
            </div>
            <div class="form-group">
                <label for="solution_sql">{{ _('admin_solution_sql') }}</label>
                <textarea id="solution_sql" name="solution_sql" rows="4" class="code-textarea" placeholder="SELECT * FROM employees ORDER BY salary DESC LIMIT 1;" required>{{ question.solution_sql }}</textarea>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-success" style="flex: 1;">Save Changes</button>
                <a href="{{ url_for('admin.admin_dashboard') }}" class="btn btn-outline" style="flex: 1; text-align: center; line-height: 2.2;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function handleImageUpload() {
    const fileInput = document.getElementById('image-upload-input');
    if (fileInput.files.length === 0) {
        alert('Please select an image file first.');
        return;
    }
    
    const formData = new FormData();
    formData.append('image', fileInput.files[0]);
    
    const btn = document.querySelector('button[onclick="handleImageUpload()"]');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Uploading...';
    
    try {
        const response = await fetch("{{ url_for('admin.upload_image') }}", {
            method: 'POST',
            body: formData
        });
        
        if (!response.ok) {
            const err = await response.json();
            throw new Error(err.error || 'Upload failed');
        }
        
        const data = await response.json();
        const imgMarkdown = `![${fileInput.files[0].name}](${data.url})`;
        
        document.getElementById('image-tag-output').value = imgMarkdown;
        document.getElementById('image-upload-result').style.display = 'block';
        btn.disabled = false;
        btn.textContent = originalText;
    } catch (err) {
        alert('Error: ' + err.message);
        btn.disabled = false;
        btn.textContent = originalText;
    }
}

function copyImageTag() {
    const copyText = document.getElementById('image-tag-output');
    copyText.select();
    copyText.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(copyText.value);
    alert('Markdown image tag copied to clipboard!');
}
</script>
{% endblock %}
